<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorda rundt – Tavle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<link rel="stylesheet" href="css/felles.css">
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.45.3/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  html, body { height: 100%; }
  body { background: #081A30; color: #fff; overflow: hidden; }
  #innlogging { height: 100%; display: grid; place-items: center; text-align: center; }
  #innlogging h1 { color: #fff; font-size: 3rem; }
  .scene { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(380px, 1fr); height: 100vh; }
  #klode { position: relative; background: radial-gradient(circle at 50% 50%, #17457A 0%, #0C2340 55%, #081A30 100%); overflow: hidden; min-width: 0; }
  .side { display: flex; flex-direction: column; padding: 3vh 2.4vw; gap: 1.8vh; min-width: 0; background: #0A1E36; position: relative; }
  .side::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: repeating-linear-gradient(45deg, #C8382F 0 14px, #F5EFE1 14px 22px, #1D5B8F 22px 36px, #F5EFE1 36px 44px); }
  .tittel { display: flex; align-items: center; gap: .8rem; }
  .tittel h1 { color: #fff; font-size: clamp(1.8rem, 3.6vw, 4rem); margin: 0; line-height: .95; }
  .tittel h1::before { content: 'AVGANGER · VERDEN'; display: block; font: 500 clamp(.7rem, .9vw, 1rem) var(--font-mono); letter-spacing: .3em; color: var(--sol); margin-bottom: .5em; }
  .tittel .spillnavn { color: var(--lys-tekst); font: 700 clamp(.9rem, 1.2vw, 1.3rem) var(--font); }
  .nedtelling { margin-left: auto; text-align: right; }
  .nedtelling b { font: 500 clamp(1.8rem, 3.2vw, 3.6rem) var(--font-mono); color: var(--sol); display: block; line-height: 1; }
  .nedtelling small { color: var(--lys-tekst); text-transform: uppercase; letter-spacing: .2em; font: 500 .8rem var(--font-mono); }
  .tavle { flex: 1; display: flex; flex-direction: column; gap: 1vh; min-height: 0; }
  .rad-g { display: grid; grid-template-columns: 2.4em 1fr auto auto; gap: .9rem; align-items: center; background: rgba(255,255,255,.05); border-radius: 16px; padding: 1.2vh 1.2vw; border-left: 10px solid var(--f); transition: transform .5s, background .5s; }
  .rad-g.forst { background: rgba(243,178,58,.16); box-shadow: inset 0 0 0 2px var(--sol); }
  .rad-g .nr { font: 500 clamp(1.4rem, 2.4vw, 2.6rem) var(--font-mono); color: var(--lys-tekst); text-align: center; }
  .rad-g.forst .nr { color: var(--sol); }
  .rad-g .navn { font: 800 clamp(1.1rem, 1.9vw, 1.9rem) var(--font-tittel); line-height: 1.05; }
  .rad-g .detaljer { font-size: clamp(.75rem, 1vw, 1rem); color: var(--lys-tekst); display: flex; gap: .6em; flex-wrap: wrap; margin-top: .2em; }
  .rad-g .poeng { font: 500 clamp(1.5rem, 2.8vw, 3rem) var(--font-mono); color: var(--sol); text-align: right; line-height: 1; }
  .rad-g .poeng small { display: block; font: 500 .7rem var(--font-mono); color: var(--lys-tekst); text-transform: uppercase; letter-spacing: .14em; }
  .rad-g .penger { font: 500 clamp(.85rem, 1.2vw, 1.2rem) var(--font-mono); color: #FCE3A8; text-align: right; white-space: nowrap; }
  .kont { display: inline-flex; gap: 2px; }
  .kont i { font-style: normal; width: 2em; height: 1.6em; border-radius: 6px; display: inline-grid; place-items: center; font: 500 .7em var(--font-mono); background: rgba(255,255,255,.08); color: #6E86A3; }
  .kont i.har { background: #3C9A64; color: #fff; }
  .nytt { background: rgba(0,0,0,.22); border-radius: 16px; padding: 1.2vh 1.2vw; max-height: 26vh; overflow: hidden; border-top: 4px solid var(--sol); }
  .nytt h3 { color: var(--sol); font: 500 .85rem var(--font-mono); text-transform: uppercase; letter-spacing: .2em; margin-bottom: .5em; }
  .nytt div { padding: .35em 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: clamp(.8rem, 1.1vw, 1.1rem); animation: inn .5s ease-out; }
  .nytt .tid { color: var(--sol); font-family: var(--font-mono); font-size: .85em; margin-right: .5em; }
  .verktoy { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 5; }
  .verktoy button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; padding: .5em 1em; min-height: 40px; font: 700 .9rem var(--font); cursor: pointer; }
  .klode-nal span { display: inline-block; transform: translate(-50%, -120%); color: #fff; font: 800 15px var(--font-tittel); padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.4); border: 2px solid #fff; pointer-events: none; }
  .klode-etikett { background: rgba(11,58,83,.92); color: #fff; padding: .5em .7em; border-radius: 10px; font-family: var(--font); }
  /* hendelse-banner */
  .hendelse { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); background: rgba(6,32,46,.92); border: 3px solid var(--f, var(--sol)); border-radius: 22px; padding: 1.6vh 2.4vw; display: flex; align-items: center; gap: 1.2vw; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: sprett .6s cubic-bezier(.2, 1.6, .4, 1); max-width: 90%; z-index: 6; }
  .hendelse .stort { font-size: clamp(2.4rem, 5vw, 5rem); line-height: 1; }
  .hendelse .t1 { font: 800 clamp(1.2rem, 2.4vw, 2.6rem) var(--font-tittel); line-height: 1.05; }
  .hendelse .t2 { color: #cfe7f3; font-size: clamp(.9rem, 1.3vw, 1.4rem); }
  @keyframes sprett { from { transform: translate(-50%, 40px) scale(.7); opacity: 0; } }
  .duell-kort { background: linear-gradient(135deg, rgba(245,158,11,.25), rgba(229,72,77,.2)); border: 2px solid var(--sol); border-radius: 16px; padding: 1.2vh 1vw; animation: pulser 2s ease-in-out infinite; }
  .duell-kort b { font-family: var(--font-tittel); font-size: clamp(1rem, 1.5vw, 1.5rem); }
  @keyframes pulser { 50% { box-shadow: 0 0 0 6px rgba(245,158,11,.25); } }
  #duellscene { position: fixed; inset: 0; z-index: 20; background: radial-gradient(circle at 50% 40%, rgba(245,158,11,.25), transparent 60%), rgba(8,26,48,.95); display: grid; place-items: center; padding: 4vh 4vw; text-align: center; }
  #duellscene .overskrift { font: 500 clamp(1.2rem, 2.4vw, 2.4rem) var(--font-mono); color: var(--sol); letter-spacing: .3em; text-transform: uppercase; }
  #duellscene .landet { font: 800 clamp(1.6rem, 3.6vw, 3.8rem) var(--font-tittel); color: #fff; margin: .2em 0 .6em; }
  #duellscene .lag { display: flex; align-items: center; justify-content: center; gap: 3vw; margin-bottom: 3vh; }
  #duellscene .lagnavn { font: 800 clamp(1.6rem, 3.4vw, 3.6rem) var(--font-tittel); padding: .2em .8em; border-radius: 999px; color: #fff; border: 4px solid #fff; }
  #duellscene .vs { font: 500 clamp(1.6rem, 3vw, 3rem) var(--font-mono); color: var(--lys-tekst); }
  #duellscene .oppgave { background: var(--papir); color: var(--blekk); border-radius: 26px; padding: 3vh 3vw; max-width: 1100px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  #duellscene .otittel { font: 800 clamp(2rem, 4.4vw, 4.6rem) var(--font-tittel); color: var(--hav); line-height: 1; margin-bottom: .3em; }
  #duellscene .otekst { font-size: clamp(1.2rem, 2.2vw, 2.3rem); line-height: 1.3; }
  #duellscene .ovinner { font-size: clamp(.95rem, 1.5vw, 1.5rem); margin-top: 1.2em; color: var(--blekk-2); }
  #duellscene .klokke { font: 800 clamp(3rem, 8vw, 8rem) var(--font-tittel); color: var(--sol); margin-top: 2vh; font-variant-numeric: tabular-nums; }
  #duellscene .klokke.ute { color: var(--korall); animation: pulser 1s infinite; }
  #duellscene .snurr { animation: snurr-inn .12s linear; }
  @keyframes snurr-inn { from { transform: translateY(-30%); opacity: .2; } }
  @media (max-width: 900px) { .scene { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; } body { overflow: auto; } }
</style>
</head>
<body>
<section id="innlogging" class="skjult">
  <div><div style="font-size:4rem">🌍📺</div><h1>Jorda rundt – tavle</h1><p style="color:#9fd3ef">Logg inn som lærer for å vise tavla. Banken kjører også her.</p>
  <button class="knapp sol" id="googleknapp">Logg inn med Google</button> <button class="knapp lys skjult" id="testinn">Testinnlogging</button>
  <p id="melding" style="color:#fca5a5"></p></div>
</section>
<div id="duellscene" class="skjult"></div>
<div class="scene skjult" id="scene">
  <div id="klode">
    <div class="verktoy"><button id="fullskjerm">⛶ Fullskjerm</button><button id="rotering">⏸ Stopp rotasjon</button></div>
  </div>
  <aside class="side">
    <div class="tittel">
      <div><h1>🌍 Jorda rundt</h1><div class="spillnavn" id="spillnavn"></div></div>
      <div class="nedtelling skjult" id="nedtelling"><b id="dager"></b><small id="dagertekst"></small></div>
    </div>
    <div id="dueller"></div>
    <div class="tavle" id="tavle"></div>
    <div class="nytt"><h3>Siste nytt</h3><div id="nytt" style="border:0;padding:0;animation:none"></div></div>
  </aside>
</div>

<script type="module">
import { r, get, onValue, loggInnLaerer, testLoggInnLaerer, vedInnlogging, brukerEmulator } from './js/fb.js';
import { startBank } from './js/bank.js';
import { innst, poengtavle, formaterKr, landEtterId, KONTINENTER } from './js/felles.js';
import { lagKlode } from './js/klode.js';
import { DUELLER } from './data/dueller.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const spillId = new URLSearchParams(location.search).get('spill');
let spill = null, klode = null, sisteLoggTid = null, kø = [], visesNaa = false, roter = true, pauseTil = 0;

$('#googleknapp').onclick = () => loggInnLaerer().catch((e) => $('#melding').textContent = e.message);
if (brukerEmulator) { $('#testinn').classList.remove('skjult'); $('#testinn').onclick = () => testLoggInnLaerer(); }

vedInnlogging(async (u) => {
  if (!u || u.isAnonymous) { $('#innlogging').classList.remove('skjult'); $('#scene').classList.add('skjult'); return; }
  if (!spillId) { $('#melding').textContent = 'Mangler spill. Åpne tavla fra lærersiden.'; $('#innlogging').classList.remove('skjult'); return; }
  $('#innlogging').classList.add('skjult'); $('#scene').classList.remove('skjult');
  try {
    klode = await lagKlode($('#klode'), { autoRoter: true });
    klode.globe.pointOfView({ lat: 25, lng: 10, altitude: 2.3 });
  } catch (e) { console.error(e); }
  onValue(r(`spill/${spillId}`), (snap) => {
    spill = snap.val();
    if (!spill) { $('#melding').textContent = 'Fant ikke spillet, eller du er ikke eier av det.'; return; }
    tegn(); klode?.oppdater(spill);
    nyeHendelser(); tegnDuell();
  }, (e) => { $('#scene').classList.add('skjult'); $('#innlogging').classList.remove('skjult'); $('#melding').textContent = 'Du har ikke tilgang til dette spillet.'; });
  startBank(spillId);
});

function tegn() {
  const i = innst(spill);
  $('#spillnavn').textContent = spill.info?.navn || '';
  if (i.sluttdato) {
    const dager = Math.ceil((new Date(i.sluttdato + 'T15:00:00') - Date.now()) / 86400000);
    $('#dager').textContent = dager > 0 ? dager : '🏁';
    $('#dagertekst').textContent = dager > 1 ? 'dager igjen' : dager === 1 ? 'dag igjen' : 'spillet er slutt';
    $('#nedtelling').classList.remove('skjult');
  } else $('#nedtelling').classList.add('skjult');

  const rader = poengtavle(spill);
  $('#tavle').innerHTML = rader.map((g, n) => {
    const her = landEtterId[g.posisjon];
    return `<div class="rad-g ${n === 0 && g.poeng > 0 ? 'forst' : ''}" style="--f:${esc(g.farge)}">
      <div class="nr">${n === 0 && g.poeng > 0 ? '👑' : n + 1}</div>
      <div style="min-width:0"><div class="navn">${esc(g.navn)}</div>
        <div class="detaljer"><span>📍 ${her ? her.flagg + ' ' + esc(her.navn) : ''}</span><span>🏳️ ${g.land.length} land</span>
        <span class="kont" title="Kontinenter">${KONTINENTER.map((k) => `<i class="${g.kontinenter.includes(k) ? 'har' : ''}" title="${k}">${{ Europa: 'EU', Asia: 'AS', Afrika: 'AF', 'Nord-Amerika': 'NA', 'Sør-Amerika': 'SA', Oseania: 'OS', Antarktis: 'AN' }[k]}</i>`).join('')}</span></div></div>
      <div class="penger">${formaterKr(g.saldo)}</div>
      <div class="poeng">${g.poeng}<small>poeng</small></div></div>`;
  }).join('') || '<p style="color:#9fd3ef">Ingen grupper ennå.</p>';

  const dueller = Object.values(spill.dueller || {}).filter((d) => d.status === 'venter');
  $('#dueller').innerHTML = dueller.map((d) => {
    const l = landEtterId[d.land]; const a = spill.grupper[d.utfordrer], b = spill.grupper[d.forsvarer];
    return `<div class="duell-kort">⚔️ <b>DUELL om ${l.flagg} ${esc(l.navn)}</b><br><span style="color:${esc(a?.farge)}">●</span> ${esc(a?.navn)} utfordrer <span style="color:${esc(b?.farge)}">●</span> ${esc(b?.navn)}</div>`;
  }).join('');

  const logg = Object.values(spill.logg || {}).sort((a, b) => b.tid - a.tid).slice(0, 8);
  $('#nytt').innerHTML = logg.map((h) => {
    const g = spill.grupper?.[h.gruppe];
    return `<div><span class="tid">${new Date(h.tid).toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' })}</span>${g ? `<b style="color:${esc(g.farge)}">${esc(g.navn)}</b> ` : ''}${esc(h.tekst)}</div>`;
  }).join('');
}

// ---------- store hendelser vises som banner + kloden flyr dit ----------
const VIKTIG = { erobring: '🏆', duell: '⚔️', fly: '✈️', laas: '🔒' };
function nyeHendelser() {
  const logg = Object.values(spill.logg || {}).sort((a, b) => a.tid - b.tid);
  if (sisteLoggTid === null) { sisteLoggTid = logg.at(-1)?.tid || Date.now(); return; }
  for (const h of logg) if (h.tid > sisteLoggTid) { if (VIKTIG[h.type]) kø.push(h); sisteLoggTid = h.tid; }
  visNeste();
}
function visNeste() {
  if (visesNaa || !kø.length) return;
  const h = kø.shift(); visesNaa = true;
  const g = spill.grupper?.[h.gruppe];
  const landId = h.type === 'fly' ? h.til : h.land;
  const l = landEtterId[landId];
  if (klode && l) {
    klode.autoRoter(false);
    if (h.type === 'fly' && h.fra) klode.visReise(h.fra, h.til);
    klode.velg(landId); klode.fokus(landId, 1.6, 1600);
  }
  const el = document.createElement('div'); el.className = 'hendelse'; el.style.setProperty('--f', g?.farge || '#F59E0B');
  el.innerHTML = `<div class="stort">${h.type === 'fly' ? '✈️' : l?.flagg || VIKTIG[h.type]}</div><div><div class="t1" style="color:${esc(g?.farge || '#fff')}">${esc(g?.navn || '')}</div><div class="t2">${esc(h.tekst)}</div></div><div class="stort">${VIKTIG[h.type]}</div>`;
  $('#klode').append(el);
  setTimeout(() => {
    el.remove(); klode?.velg(null); klode?.visReise(null, null); visesNaa = false;
    if (!kø.length && roter) klode?.autoRoter(true);
    visNeste();
  }, h.type === 'fly' ? 4500 : 6500);
}

$('#fullskjerm').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$('#rotering').onclick = () => { roter = !roter; klode?.autoRoter(roter); $('#rotering').textContent = roter ? '⏸ Stopp rotasjon' : '▶ Roter'; };
setInterval(() => spill && tegn(), 60000);

// ---------- DUELL på storskjerm ----------
let visteTrekk = null, klokkeTimer = null, snurrer = false;
function aktivDuell() {
  return Object.entries(spill?.dueller || {}).filter(([, d]) => d.status === 'venter' && d.oppgave != null).sort((a, b) => (b[1].trukket || 0) - (a[1].trukket || 0))[0];
}
function tegnDuell() {
  const funnet = aktivDuell(); const el = $('#duellscene');
  if (!funnet) { el.classList.add('skjult'); clearInterval(klokkeTimer); visteTrekk = null; return; }
  const [id, d] = funnet;
  const l = landEtterId[d.land]; const a = spill.grupper[d.utfordrer], b = spill.grupper[d.forsvarer];
  const o = DUELLER[d.oppgave];
  el.classList.remove('skjult');
  const nyTrekning = visteTrekk !== `${id}-${d.trukket}`;
  el.innerHTML = `<div><div class="overskrift">⚔️ DUELL ⚔️</div><div class="landet">${l.flagg} ${esc(l.navn)}</div>
    <div class="lag"><span class="lagnavn" style="background:${esc(a?.farge)}">${esc(a?.navn)}</span><span class="vs">mot</span><span class="lagnavn" style="background:${esc(b?.farge)}">${esc(b?.navn)}</span></div>
    <div class="oppgave"><div class="otittel" id="otittel">${esc(o.tittel)}</div><div id="orest"><div class="otekst">${esc(o.tekst)}</div><div class="ovinner"><b>Vinner:</b> ${esc(o.vinner)} &nbsp;·&nbsp; <b>Utstyr:</b> ${esc(o.utstyr)}</div></div></div>
    <div class="klokke" id="klokke"></div></div>`;
  if (nyTrekning && !snurrer) {
    visteTrekk = `${id}-${d.trukket}`; snurrer = true;
    $('#orest').style.visibility = 'hidden';
    let n = 0; const t = setInterval(() => {
      const tit = $('#otittel'); if (!tit) { clearInterval(t); snurrer = false; return; }
      tit.textContent = DUELLER[Math.floor(Math.random() * DUELLER.length)].tittel; tit.classList.remove('snurr'); void tit.offsetWidth; tit.classList.add('snurr');
      if (++n > 18) { clearInterval(t); snurrer = false; tit.textContent = o.tittel; $('#orest').style.visibility = 'visible'; }
    }, 110);
  }
  clearInterval(klokkeTimer);
  const oppdaterKlokke = () => {
    const k = $('#klokke'); if (!k) return;
    if (!o.tid) { k.textContent = ''; return; }
    if (!d.startet) { k.textContent = `${o.tid} sek`; k.classList.remove('ute'); return; }
    const igjen = Math.max(0, Math.ceil(o.tid - (Date.now() - d.startet) / 1000));
    k.textContent = igjen > 0 ? `${Math.floor(igjen / 60)}:${String(igjen % 60).padStart(2, '0')}` : 'TIDEN ER UTE! ⏰';
    k.classList.toggle('ute', igjen === 0);
  };
  oppdaterKlokke(); klokkeTimer = setInterval(oppdaterKlokke, 250);
}
</script>
</body>
</html>
