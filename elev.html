<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorda rundt</title>
<script src="js/pakke.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="ikoner/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="ikoner/favicon-192.png">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<link rel="stylesheet" href="css/felles.css">
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.45.3/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  body { overflow-x: hidden; }
  /* ---------- innlogging ---------- */
  #innlogging { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 80% 15%, rgba(243,178,58,.14), transparent 40%), radial-gradient(circle at 15% 85%, rgba(29,91,143,.45), transparent 45%), var(--hav); }
  .pass { background: var(--papir); border-radius: 22px; padding: 0 1.5rem 1.4rem; width: min(100%, 420px); box-shadow: 0 30px 80px rgba(0,0,0,.4); position: relative; overflow: hidden; }
  .pass::before { content: none; }
  .pass-omslag { background: #8E2A24; color: #F3D9A0; margin: 0 -1.5rem 1.2rem; padding: 1.5rem 1.5rem 1.3rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .45rem; }
  .pass-omslag .etikett-mono { color: #F3D9A0; }
  .pass-omslag h1 { color: #FFF4DC !important; margin: 0 !important; font-size: 2.5rem !important; }
  .pass h1 { text-align: center; font-size: 2.2rem; margin-bottom: .1em; }
  .pass p { text-align: center; }
  .pass input { font: 500 1.5rem var(--font-mono); letter-spacing: .14em; text-align: center; text-transform: uppercase; min-height: 56px; }
  .pass label { font: 500 .75rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
  .pass .knapp { width: 100%; justify-content: center; font: 800 1.25rem var(--font-tittel); padding: .8em; min-height: 56px; }

  /* ---------- hovedvisning ---------- */
  .topp { background: var(--hav); color: #fff; display: flex; align-items: center; gap: .8rem 1.4rem; padding: .7rem 1.2rem calc(.7rem + 8px); flex-wrap: wrap; position: relative; }
  .topp::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--luftpost); }
  .topp .gruppe { display: flex; align-items: center; gap: .55rem; font: 800 1.4rem var(--font-tittel); }
  .topp .gruppe .prikk { width: 1em; height: 1em; box-shadow: 0 0 0 2px #fff; }
  .tall-boks { display: flex; flex-direction: column; line-height: 1.05; }
  .tall-boks small { font: 500 .68rem var(--font-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--lys-tekst); }
  .tall-boks b { font: 800 1.4rem var(--font-tittel); font-variant-numeric: tabular-nums; }
  /* Penger, poeng og plass er knapper: trykk for å se regnskapet (kassa) eller poengtavla */
  button.tall-boks { font: inherit; color: inherit; text-align: left; cursor: pointer; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.28); border-radius: 12px; padding: .3rem .5rem .35rem; min-height: 44px; justify-content: center; margin-left: -.9rem; }
  button.tall-boks.dobbel { flex-direction: row; align-items: center; gap: .8rem; }
  button.tall-boks:hover { background: rgba(255,255,255,.18); }
  button.tall-boks[aria-pressed=true] { background: #fff; color: var(--hav); border-color: #fff; }
  button.tall-boks[aria-pressed=true] small { color: var(--blekk-2); }
  .her { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); padding: .3em .9em; border-radius: 999px; display: flex; align-items: center; gap: .45em; font-weight: 700; }
  .oppsett > * { min-width: 0; }
  #klode canvas { display: block; }
  .oppsett { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); height: calc(100vh - 70px); }
  #klode { position: relative; background: radial-gradient(circle at 50% 46%, #17457A 0%, #0C2340 58%, #081A30 100%); overflow: hidden; min-height: 300px; }
  #klode .klode-laster { position: absolute; inset: 0; display: grid; place-items: center; color: #cfe7f3; }
  .panel { background: var(--papir); overflow-y: auto; display: flex; flex-direction: column; }
  @media (max-width: 900px) {
    .oppsett { grid-template-columns: 1fr; height: auto; }
    #klode { height: 46vh; width: 100%; }
    .topp { gap: .4rem .9rem; }
    .panel { overflow: visible; }
  }
  .klode-nal span { display: inline-block; transform: translate(-50%, -120%); color: #fff; font: 800 12px var(--font-tittel); padding: 2px 8px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.35); border: 2px solid #fff; pointer-events: none; }
  .klode-nal.min span { font-size: 15px; padding: 3px 10px; animation: hopp 1.6s ease-in-out infinite; }
  @keyframes hopp { 50% { transform: translate(-50%, -140%); } }
  .klode-etikett { background: rgba(11,58,83,.92); color: #fff; padding: .5em .7em; border-radius: 10px; font-family: var(--font); font-size: 14px; line-height: 1.3; }
  .tegnforklaring { position: absolute; left: 10px; bottom: 10px; background: rgba(8,26,48,.78); border: 1px solid rgba(255,255,255,.12); color: #fff; padding: .45em .7em; border-radius: 10px; font-size: .75rem; display: flex; gap: .8em; flex-wrap: wrap; max-width: calc(100% - 20px); }
  .tegnforklaring span { display: inline-flex; align-items: center; gap: .3em; }

  .neste { flex-shrink: 0; margin: 1.1rem 1.1rem 0; padding: 1rem 1.1rem 1rem 2.8rem; border-radius: 10px 18px 18px 10px; background: var(--sol); color: var(--hav); display: flex; gap: .8rem; align-items: center; position: relative; }
  .neste::before { content: ''; position: absolute; left: .9rem; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--papir); box-shadow: inset 0 0 0 3px #C98A12; }
  .neste .ikon { font-size: 2rem; }
  .neste b { font: 800 1.2rem var(--font-tittel); color: var(--hav); }
  .faner { flex-shrink: 0; display: flex; gap: .3rem; margin: .9rem 1.1rem 0; padding: .35rem; overflow-x: auto; box-shadow: 0 6px 12px -8px rgba(12,35,64,.25); position: sticky; top: 0; background: var(--papir-2); border-radius: 16px; z-index: 5; }
  .faner button { flex: 1 0 auto; font: 700 .9rem var(--font-tittel); border: 0; background: transparent; color: var(--hav); border-radius: 12px; padding: .5em .7em; min-height: 56px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .1em; min-width: 64px; }
  .faner button .i { font-size: 1.3rem; }
  .faner button[aria-selected=true] { background: var(--hav); color: #fff; box-shadow: var(--skygge); }
  .faneinnhold { padding: 1.1rem; }

  .sok { position: relative; }
  .landliste { max-height: 260px; overflow-y: auto; border-radius: 12px; background: #fff; box-shadow: var(--skygge); margin-top: .5rem; }
  .landliste button { display: flex; width: 100%; text-align: left; gap: .6rem; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--linje); padding: .55rem .8rem; font: 1rem var(--font); cursor: pointer; color: var(--blekk); }
  .landliste button:hover, .landliste button:focus-visible { background: var(--sol-lys); }
  .landliste .f { font-size: 1.4rem; }
  .landliste small { color: var(--blekk-2); }

  .billett { background: #fff; border-radius: 16px; box-shadow: var(--skygge); display: grid; grid-template-columns: 1fr auto; overflow: hidden; margin-bottom: .8rem; position: relative; }
  .billett .venstre { padding: .9rem 1rem; }
  .billett .hoyre { padding: .9rem 1rem; border-left: 2px dashed var(--linje); display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: .4rem; background: #FBF8F0; min-width: 150px; }
  .billett::before, .billett::after { content: ''; position: absolute; right: 141px; width: 18px; height: 18px; border-radius: 50%; background: var(--papir); }
  .billett::before { top: -9px; } .billett::after { bottom: -9px; }
  .billett .selskap { font: 800 1rem var(--font-tittel); color: var(--hav); }
  .billett .rute { display: flex; align-items: center; gap: .5rem; margin: .3rem 0; font: 500 1.2rem var(--font-mono); letter-spacing: .04em; }
  .billett .linje { flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--hav-3) 0 6px, transparent 6px 11px); position: relative; min-width: 40px; }
  .billett .linje::after { content: '✈'; position: absolute; left: 50%; top: -.75em; transform: translateX(-50%); color: var(--hav-3); }
  .billett .pris { font: 800 1.4rem var(--font-tittel); color: var(--hav); font-variant-numeric: tabular-nums; }
  .billett.dyr .pris { color: var(--korall); }
  .malkort { background: var(--hav); color: #fff; border-radius: 18px; padding: 1rem 1.1rem; margin-bottom: 1rem; display: flex; gap: .9rem; align-items: center; }
  .malkort .f { font-size: 2.6rem; }
  .malkort h3 { color: #fff; margin: 0; }

  .hotell { background: #fff; border-radius: 16px; box-shadow: var(--skygge); padding: .9rem 1rem; margin-bottom: .7rem; display: grid; grid-template-columns: 1fr auto; gap: .4rem 1rem; align-items: center; border-top: 4px solid var(--hav-3); }
  .hotell h4 { margin: 0; font-size: 1.1rem; }
  .stjerner { color: var(--sol); letter-spacing: 1px; }
  .vurdering { background: var(--hav); color: #fff; font-weight: 700; border-radius: 8px 8px 8px 2px; padding: .1em .4em; font-size: .85rem; }
  .hotell .pris { text-align: right; }
  .hotell .pris b { font: 800 1.3rem var(--font-tittel); color: var(--hav); display: block; }

  .oppgavekort { background: #fff; border-radius: 16px; box-shadow: var(--skygge); padding: 1rem; margin-bottom: .8rem; }
  .oppgavekort .spm { font-weight: 700; margin-bottom: .6rem; }
  .svarvalg { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .svarvalg button { font: 700 1rem var(--font); padding: .7em; min-height: 48px; border-radius: 12px; border: 2px solid var(--linje); background: #fff; cursor: pointer; color: var(--blekk); }
  .svarvalg button[aria-pressed=true] { border-color: var(--hav); background: var(--hav); color: #fff; }
  .svarvalg button.riktig { border-color: var(--gress); background: var(--gress-lys); color: #1F5537; }
  .svarvalg button.feil { border-color: var(--korall); background: var(--korall-lys); }
  .stortflagg { font-size: 4rem; text-align: center; line-height: 1.1; }

  .infoboks { border-radius: 12px; padding: .7rem .9rem; margin-bottom: .8rem; font-size: .95rem; }
  .infoboks.sol { background: var(--sol-lys); }
  .infoboks.korall { background: var(--korall-lys); }
  .infoboks.gress { background: var(--gress-lys); }
  .infoboks.hav { background: #DDEAF5; }
  .venter { display: inline-flex; align-items: center; gap: .5em; }
  .venter::before { content: ''; width: 1em; height: 1em; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: snurr .8s linear infinite; }
  @keyframes snurr { to { transform: rotate(360deg); } }
  .landrad { display: flex; align-items: center; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid var(--linje); }
  .landrad .f { font-size: 1.6rem; }
  /* ---------- inflight ---------- */
  .panel.flyr > .neste, .panel.flyr > .faner { display: none; }
  .ife { background: linear-gradient(180deg, #071f2d, #0B3A53); color: #e6f3fa; border-radius: 20px; padding: 1rem 1.1rem 1.2rem; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .ife-topp { display: flex; justify-content: space-between; align-items: center; gap: .6rem; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: #9fd3ef; }
  .ife-topp b { color: #fff; font-family: var(--font-tittel); letter-spacing: .04em; font-size: 1rem; }
  .ife-rute { font: 800 1.35rem var(--font-tittel); color: #fff; margin: .4rem 0 .2rem; }
  .spor { position: relative; height: 46px; margin: .8rem .4rem .2rem; }
  .spor .linje { position: absolute; left: 0; right: 0; top: 22px; border-top: 2px dashed rgba(159,211,239,.5); }
  .spor .fylt { position: absolute; left: 0; top: 21px; height: 4px; background: var(--sol); border-radius: 4px; transition: width .8s ease; }
  .spor .punkt { position: absolute; top: 15px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #0B3A53; border: 3px solid #9fd3ef; }
  .spor .punkt span { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: .7rem; white-space: nowrap; color: #9fd3ef; }
  .spor .fly { position: absolute; top: 4px; font-size: 1.7rem; margin-left: -.85rem; transition: left .8s ease; transform: rotate(45deg); }
  .ife-status { display: flex; gap: 1rem; justify-content: center; margin: 1.1rem 0 .4rem; font-size: .95rem; }
  .ife-status b { font: 800 1.3rem var(--font-tittel); color: #fff; }
  .hjul-boks { display: grid; place-items: center; padding: .6rem 0 .2rem; position: relative; }
  .hjul-peker { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 24px solid var(--sol); z-index: 2; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .hjul { width: min(250px, 70vw); aspect-ratio: 1; border-radius: 50%; position: relative; border: 6px solid #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.15), 0 10px 30px rgba(0,0,0,.4); transition: transform 2.4s cubic-bezier(.12,.8,.18,1); }
  .hjul-ikon { position: absolute; transform: translate(-50%, -50%); font-size: 1.9rem; z-index: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .hjul::after { content: ''; position: absolute; inset: 40%; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 4px var(--hav); }
  .ife-spm { background: var(--papir); color: var(--blekk); border-radius: 16px; padding: 1rem; margin-top: 1rem; }
  .ife-spm .kat { display: inline-flex; gap: .4em; align-items: center; font-weight: 700; font-size: .85rem; padding: .2em .7em; border-radius: 999px; color: #fff; }
  .ife-spm .tekst { font: 700 1.15rem/1.35 var(--font); margin: .6rem 0 .8rem; }
  .ife-tilbakemelding { border-radius: 12px; padding: .7rem .9rem; margin-top: .8rem; font-weight: 700; }
  .ife-tilbakemelding.ok { background: var(--gress-lys); color: #1d6b41; }
  .ife-tilbakemelding.feil { background: var(--korall-lys); color: #8d2226; animation: rist .5s; }
  @keyframes rist { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  /* ---------- veiviser ---------- */
  .veiviser { background: var(--papir); border-radius: 24px; width: min(100%, 560px); max-height: 92vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.35); position: relative; }
  .vv-topp { background: radial-gradient(circle at 70% 30%, #1b6a90, #0B3A53 70%); color: #fff; padding: 1.6rem 1.4rem 1.2rem; text-align: center; border-radius: 24px 24px 0 0; }
  .vv-ikon { font-size: 3.4rem; line-height: 1; display: inline-grid; place-items: center; width: 5.2rem; height: 5.2rem; border-radius: 50%; background: rgba(255,255,255,.12); animation: sprett-inn .45s cubic-bezier(.2,1.5,.4,1); }
  @keyframes sprett-inn { from { transform: scale(.5); opacity: 0; } }
  .vv-topp h2 { color: #fff; margin: .6rem 0 0; font-size: 1.7rem; }
  .vv-tekst { padding: 1.2rem 1.4rem .4rem; font-size: 1.05rem; line-height: 1.55; min-height: 17rem; }
  .vv-tekst p { margin: 0 0 .8rem; }
  .vv-tekst .liste { display: grid; gap: .45rem; margin: .2rem 0 .9rem; }
  .vv-tekst .liste div { display: grid; grid-template-columns: 2rem 1fr; gap: .4rem; align-items: start; background: #fff; border-radius: 12px; padding: .5rem .7rem; box-shadow: var(--skygge); font-size: .97rem; }
  .vv-tekst .liste div > span:first-child { font-size: 1.3rem; line-height: 1.2; }
  .vv-bunn { display: flex; align-items: center; gap: .6rem; padding: .8rem 1.4rem 1.3rem; }
  .vv-prikker { display: flex; gap: .35rem; flex: 1; justify-content: center; }
  .vv-prikker i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--linje); }
  .vv-prikker i.aktiv { background: var(--sol); width: 1.4rem; border-radius: 999px; }
  .vv-hopp { position: absolute; top: .8rem; right: 1rem; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; padding: .3em .8em; font: 700 .85rem var(--font); cursor: pointer; }
  .feiring { position: fixed; inset: 0; pointer-events: none; z-index: 999; display: grid; place-items: center; font-size: 6rem; animation: feir 1.6s ease-out forwards; }
  @keyframes feir { from { transform: scale(.3); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } to { transform: scale(1.4) translateY(-60px); opacity: 0; } }

  /* 3D-detaljer */
  .topp { background: linear-gradient(180deg, #17457A, var(--hav) 70%); }
  .neste { background: linear-gradient(180deg, #FFD875, var(--sol)); box-shadow: 0 4px 0 #B07510, 0 10px 20px rgba(176,117,16,.25); margin-bottom: 4px; }
  .faner { background: var(--papir-2); box-shadow: inset 0 2px 4px rgba(12,35,64,.12), 0 6px 12px -8px rgba(12,35,64,.25); gap: .4rem; padding: .45rem .45rem .7rem; }
  .faner button { background: linear-gradient(180deg, #FFFFFF, #F1E9D8); box-shadow: inset 0 1px 0 #fff, 0 3px 0 #CBBC99; position: relative; top: 0; transition: top .08s, box-shadow .08s; }
  .faner button:hover { background: linear-gradient(180deg, #FFFFFF, #F7EFDD); }
  .faner button:active { top: 2px; box-shadow: 0 1px 0 #CBBC99; }
  .faner button[aria-selected=true] { background: linear-gradient(180deg, #1F5390, var(--hav)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 3px 0 #04101F, 0 6px 12px rgba(12,35,64,.25); }
  .svarvalg button { background: linear-gradient(180deg, #FFFFFF, #F6F0E3); box-shadow: 0 4px 0 var(--linje); margin-bottom: 4px; position: relative; top: 0; transition: top .08s, box-shadow .08s; }
  .svarvalg button:active:not(:disabled) { top: 3px; box-shadow: 0 1px 0 var(--linje); }
  .svarvalg button[aria-pressed=true] { background: linear-gradient(180deg, #1F5390, var(--hav)); border-color: var(--hav); box-shadow: 0 4px 0 #04101F; }
  .svarvalg button.riktig { background: linear-gradient(180deg, #EEF9F2, var(--gress-lys)); box-shadow: 0 4px 0 #9DCFB1; }
  .svarvalg button.feil { background: linear-gradient(180deg, #FFF1EF, var(--korall-lys)); box-shadow: 0 4px 0 #E6A49E; }
  .malkort { background: linear-gradient(135deg, #1F5390, var(--hav) 70%); box-shadow: 0 4px 0 #04101F, var(--skygge); }
  .billett { box-shadow: 0 3px 0 #E2D6BC, var(--skygge); }
  .hotell, .oppgavekort { box-shadow: 0 3px 0 #E2D6BC, var(--skygge); }
  .landliste button:hover, .landliste button:focus-visible { background: linear-gradient(90deg, var(--sol-lys), #fff); }
  .utfordring { flex-shrink: 0; margin: .9rem 1.1rem 0; padding: .8rem 1rem; border-radius: 14px; background: var(--korall); color: #fff; display: flex; gap: .8rem; align-items: center;
    box-shadow: 0 4px 0 #8E2019, 0 10px 20px rgba(142,32,25,.25); animation: utf-inn .5s ease-out; }
  .utfordring .ikon { font-size: 2rem; line-height: 1; }
  .utfordring b { font: 800 1.08rem var(--font-tittel); display: block; }
  .utfordring p { margin: .1rem 0 0; font-size: .92rem; opacity: .95; }
  .utfordring + .utfordring { margin-top: .5rem; }
  @keyframes utf-inn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .bekreft-bg { position: fixed; inset: 0; background: rgba(12,35,64,.55); display: grid; place-items: center; z-index: 60; padding: 1rem; }
  .bekreft { background: var(--papir); border-radius: 18px; padding: 1.4rem 1.4rem 1.1rem; max-width: 420px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center; }
  .bekreft .stor { font-size: 3rem; line-height: 1; }
  .bekreft h3 { font: 800 1.35rem var(--font-tittel); color: var(--hav); margin: .4rem 0 .4rem; }
  .bekreft p { color: var(--blekk-2); margin: 0 0 1rem; }
  .bekreft .rad { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
.nedtelling { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- justerbar deling mellom kart og meny ---------- */
  @media (min-width: 901px) { .oppsett { grid-template-columns: minmax(0, 55fr) 22px minmax(0, 45fr); } }
  .deler { position: relative; background: var(--papir-2); display: flex; align-items: center; justify-content: center; cursor: col-resize; touch-action: none; user-select: none; -webkit-user-select: none; z-index: 6; box-shadow: inset 1px 0 0 var(--linje), inset -1px 0 0 var(--linje); }
  .deler::before { content: ''; position: absolute; left: 9px; top: calc(50% - 96px); width: 4px; height: 40px; border-radius: 4px; background: repeating-linear-gradient(180deg, var(--blekk-2) 0 3px, transparent 3px 7px); opacity: .45; }
  .deler.drar, .deler:hover { background: var(--sol-lys); }
  .deler-knapper { display: flex; flex-direction: column; gap: 10px; }

<body>

<!-- ============ INNLOGGING ============ -->
<section id="innlogging" class="skjult">
  <form class="pass" id="innskjema" autocomplete="off">
    <div class="pass-omslag"><svg width="56" height="56" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="32" cy="32" r="26"/><ellipse cx="32" cy="32" rx="11" ry="26"/><line x1="6" y1="32" x2="58" y2="32"/><path d="M10 19h44M10 45h44"/></svg><span class="etikett-mono">Reisepass · klasserom</span><h1 data-p="navn">Jorda rundt</h1></div>
    <p class="dempet">Skriv inn koden og PIN-en fra gruppekortet deres.</p>
    <div class="felt"><label for="kode">Gruppekode</label><input id="kode" name="gruppekode" required placeholder="TIGER42" maxlength="16" autocapitalize="characters" autocomplete="off" spellcheck="false" data-lpignore="true"></div>
    <div class="felt"><label for="pin">PIN</label><input id="pin" name="gruppepin" required inputmode="numeric" placeholder="••••••" maxlength="6" type="text" autocomplete="one-time-code" spellcheck="false" data-lpignore="true" style="-webkit-text-security: disc; text-security: disc"></div>
    <button class="knapp sol" id="innknapp">Start reisen ✈️</button>
    <p id="innfeil" class="liten" style="color:var(--korall);min-height:1.4em;margin-bottom:0"></p>

  </form>
</section>

<!-- ============ SPILLET ============ -->
<div id="spillet" class="skjult">
  <header class="topp">
    <div class="gruppe"><span class="prikk" id="gfarge"></span><span id="gnavn"></span></div>
    <div class="her" id="her"></div>
    <span class="vokser"></span>
    <button class="tall-boks" data-fane="kassa" title="Se regnskapet"><small>Penger</small><b id="saldo" class="tall"></b></button>
    <button class="tall-boks dobbel" data-fane="tavle" title="Se poengtavla"><span class="tall-boks"><small>Poeng</small><b id="poeng" class="tall"></b></span><span class="tall-boks"><small>Plass</small><b id="plass" class="tall"></b></span></button>
    <button class="knapp lys mini" id="hjelp" title="Se veiledningen igjen">❓ Hjelp</button>
    <button class="knapp lys mini" id="loggut" title="Logg ut">Logg ut</button>
  </header>
  <div class="oppsett">
    <div id="klode"><div class="klode-laster" data-p="kart.laster">Laster kartet …</div>
      <div class="tegnforklaring"><span><i class="prikk" style="background:#EFE6D2"></i> ledig</span><span><i class="prikk" style="background:#9AA3AD"></i> stengt</span><span>sterk farge = låst 🔒</span><span>trykk på <span data-p="ord.etSted">et land</span> for å reise dit</span></div>
    </div>
    <div class="deler" id="deler" role="separator" aria-label="Juster størrelsen på kartet og menyen" title="Dra for å endre størrelsen. Dobbeltklikk for å tilbakestille.">
      <div class="deler-knapper"><button type="button" id="deler-a" aria-label="Mindre kart, større meny">◀</button><button type="button" id="deler-b" aria-label="Større kart, mindre meny">▶</button></div>
    </div>
    <div class="panel">
      <div id="utfordringer"></div>
      <div class="neste" id="neste"></div>
      <nav class="faner" role="tablist">
        <button data-fane="reis" aria-selected="true"><span class="i">✈️</span>Reis</button>
        <button data-fane="hotell"><span class="i">🏨</span>Hotell</button>
        <button data-fane="logg"><span class="i">📓</span>Reiselogg</button>
        <button data-fane="jobb"><span class="i">💼</span>Jobb</button>
        <button data-fane="quiz"><span class="i">🧭</span>Quiz</button>
      </nav>
      <div class="faneinnhold" id="innhold"></div>
    </div>
  </div>
</div>
<div id="varsler" aria-live="polite"></div>

<script type="module">
import { T, LOKALE } from './js/sprak.js';
import { auth, r, get, set, push, onValue, loggInnElev, loggUt, vedInnlogging, brukerEmulator } from './js/fb.js';
import { flyTilbud, hoteller, formaterVarighet, iLokalValuta, avstandKm } from '#pakke/motor.js';
import { innst, idag, erStengt, erLaast, laasesOm, poengtavle, lagJobb, lagQuiz, formaterKr, laasesVed, oppdaterNedtellinger, nedtelling, hotellEffekt, flyPrisMedRabatt, STJERNE_EFFEKT, FASILITET_EFFEKT, HENDELSE_SJANSE, nyId, LAND, landEtterId, KONTINENTER, landInfo, landKode, byerILand, heltLandBonus, PAKKE, ORD, stor, lagringsnokkel, teltQuiz, erSynlig, DIKTATNAVN , avstandTekst, veiviserPakke, UTSTYR, utstyrMangler } from './js/felles.js';
fyllPakkeTekster();
document.title = PAKKE.navn;
import { lagKlode } from '#pakke/klode.js';
import { fyllPakkeTekster } from './js/side.js';
import { ORD as PARLOR_ORD, SPRAK, sprakFor } from '#pakke/parlor.js';
import * as PARLOR from '#pakke/parlor.js';   // harDiktat finnes bare i noen spillpakker
import { KATEGORIER, flySporsmal } from './data/flyquiz.js';
import { visVelkommen, velkomstApen } from './js/velkommen.js';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lagre = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const hent = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

let spillId = null, gid = null, spill = null, g = null, klode = null, stopp = null;
let dk = { land: null, svar: [] };
let teltValg = null, fane = 'reis', reiseMal = null, sokTekst = '', jobb = null, quiz = null, quizSvar = [], venterPa = {};

function varsle(tekst, type = '') {
  const el = document.createElement('div'); el.className = 'varsel ' + type; el.textContent = tekst;
  $('#varsler').append(el); setTimeout(() => el.remove(), 5000);
}
function bekreft(ikon, tittel, tekst, jaTekst) {
  return new Promise((ok) => {
    const bg = document.createElement('div'); bg.className = 'bekreft-bg';
    bg.innerHTML = T`<div class="bekreft" role="dialog" aria-modal="true"><div class="stor">${ikon}</div><h3>${esc(tittel)}</h3><p>${tekst}</p>
      <div class="rad"><button class="knapp lys" data-v="0">Nei, vent litt</button><button class="knapp sol" data-v="1">${esc(jaTekst)}</button></div></div>`;
    bg.addEventListener('click', (e) => { const v = e.target.closest('[data-v]')?.dataset.v; if (v !== undefined || e.target === bg) { bg.remove(); ok(v === '1'); } });
    document.body.append(bg); bg.querySelector('[data-v="1"]').focus();
  });
}
// Andre grupper som er på vei til å utfordre et av våre land
function trusler() {
  const i = innst(spill); const ut = [];
  for (const [hid, h] of Object.entries(spill.grupper || {})) {
    if (hid === gid) continue;
    let land, fase;
    if (h.iLufta?.til) { land = h.iLufta.til; fase = 'flyr'; }
    else if (h.posisjon) {
      land = h.posisjon;
      const st = spill.reiselogger?.[hid]?.[land]?.status;
      if (['godkjent', 'tapt', 'laast'].includes(st)) continue;
      fase = st === 'duell' ? 'duell' : st === 'levert' ? 'levert' : 'landet';
    }
    const e = land && spill.eierskap?.[land];
    if (!e || e.gruppe !== gid || (fase !== 'duell' && erLaast(e, i))) continue;
    ut.push({ hid, navn: h.navn || T('En gruppe'), land, fase });
  }
  return ut;
}
function tegnUtfordringer() {
  const liste = trusler();
  const TEKST = {
    flyr: (t, l) => [T`${esc(t.navn)} er på vei til ${l.flagg} ${esc(l.navn)}!`, T`${stor(ORD.stedet)} er deres. Fullfører de reiseloggen der, blir det duell.`],
    landet: (t, l) => [T`${esc(t.navn)} har kommet til ${l.flagg} ${esc(l.navn)}!`, T`De jobber med reiseloggen. Blir den godkjent, blir det duell om ${ORD.stedet}.`],
    levert: (t, l) => [T`${esc(t.navn)} har levert reiseloggen for ${l.flagg} ${esc(l.navn)}!`, T('Godkjenner læreren den, blir det duell. Gjør dere klare!')],
    duell: (t, l) => [T`Duell om ${l.flagg} ${esc(l.navn)} snart!`, T`Dere møter ${esc(t.navn)}. Følg med på tavla – læreren starter duellen.`],
  };
  $('#utfordringer').innerHTML = liste.map((t) => {
    const l = landEtterId[t.land]; const [tittel, under] = TEKST[t.fase](t, l);
    const e = spill.eierskap?.[t.land]; const igjen = t.fase !== 'duell' ? nedtell(e, innst(spill)) : '';
    return `<div class="utfordring"><span class="ikon">⚔️</span><div><b>${tittel}</b><p>${under}${igjen ? T` ${stor(ORD.stedet)} blir ${ORD.trygt} om <b>${igjen}</b>.` : ''}</p></div></div>`;
  }).join('');
  // lite sprettvarsel første gang vi ser en ny utfordring (og når duellen er klar)
  for (const t of liste) {
    const nokkel = `${PAKKE.prefiks}-utf-${spillId}-${gid}-${t.hid}-${t.land}-${t.fase === 'duell' ? T('duell') : T('start')}`;
    let sett = false; try { sett = !!localStorage.getItem(nokkel); localStorage.setItem(nokkel, '1'); } catch {}
    if (!sett) varsle(t.fase === 'duell' ? T`⚔️ Duell om ${landEtterId[t.land].navn} snart – mot ${t.navn}!` : T`⚔️ ${t.navn} er på vei for å utfordre dere om ${landEtterId[t.land].navn}!`, 'feil');
  }
}
function feir(emoji = '🎉') { const el = document.createElement('div'); el.className = 'feiring'; el.textContent = emoji; document.body.append(el); setTimeout(() => el.remove(), 1700); }

// ================= INNLOGGING =================
vedInnlogging(async (u) => {
  const lagretSpill = hent(lagringsnokkel('elev-spill'));
  if (u && lagretSpill) {
    const m = (await get(r(`medlem/${lagretSpill}/${u.uid}`)).catch(() => null))?.val();
    if (m?.gruppe) return startSpill(lagretSpill, m.gruppe);
  }
  $('#innlogging').classList.remove('skjult'); $('#spillet').classList.add('skjult');
});

$('#innskjema').onsubmit = async (e) => {
  e.preventDefault();
  const kode = $('#kode').value.trim().toUpperCase().replace(/\s/g, ''), pin = $('#pin').value.trim();
  $('#innfeil').textContent = ''; $('#innknapp').disabled = true;
  try {
    if (!auth.currentUser) await loggInnElev();
    const gk = (await get(r(`gruppekoder/${kode}`))).val();
    if (!gk) throw new Error(T('Fant ingen gruppe med den koden. Sjekk kortet!'));
    try { await set(r(`medlem/${gk.spill}/${auth.currentUser.uid}`), { gruppe: gk.gruppe, pin, tid: Date.now() }); }
    catch { throw new Error(T('Feil PIN. Prøv igjen!')); }
    lagre(lagringsnokkel('elev-spill'), gk.spill);
    startSpill(gk.spill, gk.gruppe);
  } catch (err) { $('#innfeil').textContent = err.message; }
  finally { $('#innknapp').disabled = false; }
};
$('#loggut').onclick = async () => {
  lagre(lagringsnokkel('elev-spill'), null); stopp?.(); await loggUt(); location.reload();
};

async function startSpill(sid, gruppe) {
  spillId = sid; gid = gruppe;
  $('#innlogging').classList.add('skjult'); $('#spillet').classList.remove('skjult');
  stopp = onValue(r(`spill/${sid}`), (snap) => {
    const forrige = g;
    spill = snap.val(); g = spill?.grupper?.[gid];
    if (!g) { varsle(T('Gruppa finnes ikke lenger.'), 'feil'); return; }
    sjekkEndringer(forrige, g); sjekkNyeLand();
    tegnTopp(); tegnUtfordringer(); tegnNeste(); tegnFane(); klode?.oppdater(spill, gid); kanskjeVisVeiviser(); kanskjeVisVelkommen();
  }, () => { lagre(lagringsnokkel('elev-spill'), null); location.reload(); });
  try {
    klode = await lagKlode($('#klode'), { vedKlikk: (id) => { reiseMal = id; sikreMeny(); velgFane('reis'); } });
    $('.klode-laster')?.remove();
    if (spill) { klode.oppdater(spill, gid); klode.fokus(g.posisjon, 2.2, 1500); }
  } catch (e) { $('.klode-laster').textContent = T('Kartet kunne ikke lastes, men resten av spillet virker.'); console.error(e); }
}

function sjekkEndringer(foer, naa) {
  if (!foer || !naa) return;
  if (foer.posisjon !== naa.posisjon) { klode?.fokus(naa.posisjon, 2.0, 2000); klode?.visReise(null, null); }
}
let antallLand = null;
function sjekkNyeLand() {
  const n = Object.values(spill.eierskap || {}).filter((e) => e.gruppe === gid).length;
  if (antallLand !== null && n > antallLand) { feir('🏆'); varsle(T`Dere har fått ${ORD.nyttSted}! 🎉`, 'ok'); }
  antallLand = n;
}

// ================= VEIVISER =================
const vvNokkel = () => `${PAKKE.prefiks}-veiviser-${spillId}-${gid}`;
function veiviserSider() {
  const i = innst(spill); const l = landEtterId[g.start || g.posisjon] || landEtterId[g.posisjon];
  const slutt = i.sluttdato ? T` Spillet varer til <b>${new Date(i.sluttdato + 'T12:00').toLocaleDateString(LOKALE, { day: 'numeric', month: 'long' })}</b>.` : '';
  const li = (ikon, tekst) => `<div><span>${ikon}</span><span>${tekst}</span></div>`;
  if (veiviserPakke) return veiviserPakke({ g, l, i, slutt, li, esc, formaterKr, startbelop: startbelop() });   // spillpakken har egen guide
  // Jorda rundt (stedene er land) og Europa rundt (stedene er byer i land) har hver sin guide
  return PAKKE.modell === 'land' ? [
    { ikon: '👋', tittel: T`Velkommen, ${esc(g.navn)}!`, tekst: T`<p>Dere er en reisegruppe på <b>${g.personer || 4}</b> med <b>${formaterKr(startbelop())}</b> i reisekassa.</p><p>Reisen starter i <b>${l.flagg} ${esc(l.by)}, ${esc(l.navn)}</b>. Målet er å erobre flest mulig land – før de andre gruppene gjør det!${slutt}</p><p class="dempet">Bla deg gjennom denne korte guiden. Den tar to minutter.</p>` },
    { ikon: '🏆', tittel: T('Slik får dere poeng'), tekst: T`<div class="liste">${li('🏳️', T`<b>${i.poengLand} poeng</b> for hvert land dere eier`)}${li('🌍', T`<b>${i.poengKontinent} poeng</b> for hvert kontinent dere har minst ett land på`)}${li('🐧', T('Det finnes 7 kontinenter – også Antarktis! Dit går det bare fly fra Chile.'))}</div><p>Det lønner seg altså å spre seg utover verden.</p>` },
    { ikon: '🏨', tittel: T('Først: book hotell'), tekst: T`<p>I hvert nytt land må dere først booke hotell for <b>tre netter</b>. Uten hotell kan dere ikke gjøre noe der.</p><div class="liste">${li('⭐', T('<b>Billig hostell</b> = dårlig søvn: færre jobber per dag og lavere lønn.'))}${li('🌟', T('<b>Luksushotell</b> = uthvilte: flere jobber og høyere lønn.'))}${li('🍳', T('Fasiliteter gir fordeler: frokost (+1 jobb), flyplassbuss (−10 % fly), wifi (50/50-livline).'))}${li('🎲', T('På de billigste hotellene kan det skje overraskelser – gode og dårlige!'))}</div>` },
    { ikon: '📓', tittel: T('Reiseloggen gir dere landet'), tekst: T`<div class="liste">${li('1️⃣', T('Fyll ut den fysiske reiseloggen: fakta, kultur og reisen.'))}${li('2️⃣', T('Trykk <b>«Vi har levert reiseloggen»</b> under fanen Reiselogg.'))}${li('3️⃣', T('Læreren godkjenner – og landet blir deres! 🎉'))}</div><p>Eier en annen gruppe landet allerede? Da blir det <b>⚔️ duell</b> om det!</p>` },

function startbelop() { const i = innst(spill); return (i.startbelopPerElev || 0) * (g.personer || 4) || g.saldo; }
function visVeiviser(start = 0) {
  document.querySelector('.vv-bakgrunn')?.remove();
  const sider = veiviserSider(); let n = start;
  const bg = document.createElement('div'); bg.className = T('modal-bakgrunn vv-bakgrunn');
  const lukk = () => { bg.remove(); try { localStorage.setItem(vvNokkel(), '1'); } catch {} document.removeEventListener('keydown', tast); };
  const tast = (e) => { if (e.key === 'ArrowRight' && n < sider.length - 1) { n++; tegn(); } else if (e.key === 'ArrowLeft' && n > 0) { n--; tegn(); } else if (e.key === 'Escape') lukk(); };
  function tegn() {
    const sd = sider[n];
    bg.innerHTML = T`<div class="veiviser" role="dialog" aria-modal="true" aria-label="Veiledning">
      <div class="vv-topp"><button class="vv-hopp">${n === sider.length - 1 ? T('Lukk') : T('Hopp over')}</button><div class="vv-ikon">${sd.ikon}</div><h2>${sd.tittel}</h2></div>
      <div class="vv-tekst">${sd.tekst}</div>
      <div class="vv-bunn"><button class="knapp lys" data-vv="-1" ${n === 0 ? 'style="visibility:hidden"' : ''}>← Tilbake</button>
        <div class="vv-prikker">${sider.map((_, k) => `<i class="${k === n ? 'aktiv' : ''}"></i>`).join('')}</div>
        <button class="knapp sol" data-vv="1">${n === sider.length - 1 ? T('Start reisen! 🚀') : T('Neste →')}</button></div></div>`;
    bg.querySelector('.vv-hopp').onclick = lukk;
    bg.querySelectorAll('[data-vv]').forEach((b) => b.onclick = () => { const d = Number(b.dataset.vv); if (n + d >= sider.length) return lukk(); n = Math.max(0, n + d); tegn(); });
    bg.querySelector('[data-vv="1"]').focus();
  }
  document.addEventListener('keydown', tast);
  document.body.append(bg); tegn();
}
$('#hjelp').onclick = () => visVeiviser(0);
let veiviserSjekket = false;
function kanskjeVisVeiviser() {
  if (veiviserSjekket) return; veiviserSjekket = true;
  let sett = null; try { sett = localStorage.getItem(vvNokkel()); } catch {}

// ================= KART / MENY – JUSTERBAR DELING =================
// Side om side (iPad på tvers, PC): kartets andel i prosent. Over hverandre (iPad på høykant): kartets høyde i vh.
const DELING_BRED = [0, 35, 55, 75, 100];
const DELING_HOY = [0, 25, 46, 65, 85];
const stabletMq = matchMedia('(max-width: 900px)');
let deling = { p: 55, h: 46 };
try { Object.assign(deling, JSON.parse(hent(lagringsnokkel('deling')) || '{}')); } catch {}
function brukDeling(lagreNa = true) {
  const o = $('.oppsett'); if (!o) return;
  const stablet = stabletMq.matches, { p, h } = deling;
  o.classList.toggle('kart-skjult', stablet ? h <= 0 : p <= 0);
  o.classList.toggle('meny-skjult', !stablet && p >= 100);
  if (stablet) { o.style.gridTemplateColumns = ''; o.style.setProperty('--karthoyde', h + 'vh'); }
  else o.style.gridTemplateColumns = p <= 0 ? '0px 22px minmax(0,1fr)' : p >= 100 ? T('minmax(0,1fr) 22px 0px') : T`minmax(0,${p}fr) 22px minmax(0,${100 - p}fr)`;
  $('#deler-a').textContent = stablet ? '▲' : '◀';
  $('#deler-b').textContent = stablet ? '▼' : '▶';
  $('#deler-a').disabled = stablet ? h <= 0 : p <= 0;
  $('#deler-b').disabled = stablet ? h >= DELING_HOY[DELING_HOY.length - 1] : p >= 100;
  if (lagreNa) lagre(lagringsnokkel('deling'), JSON.stringify(deling));
}
function stegDeling(retning) {
  const stablet = stabletMq.matches, liste = stablet ? DELING_HOY : DELING_BRED, naa = stablet ? deling.h : deling.p;
  const ny = retning > 0 ? liste.find((v) => v > naa + 1) : [...liste].reverse().find((v) => v < naa - 1);
  if (ny === undefined) return;
  if (stablet) deling.h = ny; else deling.p = ny;
  brukDeling();
}
/** Sørger for at menyen synes (f.eks. når noen trykker på kartet mens menyen er skjult). */
function sikreMeny() { if (!stabletMq.matches && deling.p >= 100) { deling.p = 55; brukDeling(); } }
(() => {
  const d = $('#deler'); let drar = false;
  $('#deler-a').onclick = (e) => { e.stopPropagation(); stegDeling(-1); };
  $('#deler-b').onclick = (e) => { e.stopPropagation(); stegDeling(1); };
  d.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; drar = true; d.setPointerCapture(e.pointerId); d.classList.add('drar'); e.preventDefault(); });
  d.addEventListener('pointermove', (e) => {
    if (!drar) return;
    const o = $('.oppsett').getBoundingClientRect();
    if (stabletMq.matches) {
      const h = (e.clientY - o.top) / innerHeight * 100;
      deling.h = Math.round(h < 8 ? 0 : Math.min(85, h));
    } else {
      const p = (e.clientX - o.left) / o.width * 100;
      deling.p = Math.round(p < 12 ? 0 : p > 92 ? 100 : Math.max(20, Math.min(85, p)));
    }
    brukDeling(false);
  });

function tegnFane() {
  if (!spill || !g) return;
  if (g.iLufta) { if (!fq?.spinner) tegnFly(); klode?.visReise(g.iLufta.fra, g.iLufta.til); return; }

  const aktiv = document.activeElement;
  if (aktiv && aktiv.matches?.('#innhold input') && fane !== 'reis') return;
  ({ reis: tegnReis, hotell: tegnHotell, logg: tegnLogg, jobb: tegnJobb, quiz: tegnQuiz, kassa: tegnKassa, tavle: tegnTavle })[fane]();

// ---------- send forespørsel til banken ----------
function send(type, data) {
  return new Promise(async (ferdig) => {
    if (venterPa[type]) return;
    venterPa[type] = true; tegnFane();
    const fRef = push(r(`spill/${spillId}/foresporsler/${gid}`));
    let tregt = setTimeout(() => varsle(T('Banken bruker lang tid … Vent litt, eller prøv igjen om et øyeblikk.'), 'feil'), 15000);
    const av = onValue(fRef, (snap) => {
      const f = snap.val();
      if (f && f.status !== 'venter' && f.status !== 'behandles') {
        clearTimeout(tregt); av(); venterPa[type] = false;
        varsle(f.svar, f.status === 'ok' ? 'ok' : 'feil');
        ferdig({ ok: f.status === 'ok', svar: f.svar }); tegnFane();
      }
    });
    try { await set(fRef, { type, uid: auth.currentUser.uid, status: 'venter', tid: Date.now(), data }); }
    catch (e) { clearTimeout(tregt); av(); venterPa[type] = false; varsle(T('Kunne ikke sende. Er dere fortsatt logget inn?'), 'feil'); ferdig({ ok: false }); tegnFane(); }
  });
}

    if (eierE && eierE.gruppe !== gid && !erLaast(eierE, innst(spill))) {
      const motstander = spill.grupper[eierE.gruppe]?.navn || T('en annen gruppe');
      const ok = await bekreft('⚔️', T`Utfordre ${motstander}?`, T`<b>${esc(mal.navn)}</b> eies av <b>${esc(motstander)}</b>. Fullfører dere reiseloggen der, blir det <b>duell</b> om ${ORD.stedet} – og ${esc(motstander)} får beskjed om at dere kommer.`, T('Ja, vi utfordrer!'));
      if (!ok) return;
    }
    const res = await send('fly', { til: reiseMal, valg: Number(b.dataset.kjop), dato: idag(), pris: flyPrisMedRabatt(t.totalt, g.hotell, g.posisjon, t.type) });
    if (res.ok) { feir({ tog: '🚆', buss: '🚌', bat: '⛴️' }[t.type] || '✈️'); reiseMal = null; fane = 'hotell'; }
  });
}

// ---------- HOTELL ----------
function tegnHotell() {
  const el = $('#innhold'); const l = landEtterId[g.posisjon];
  if (harHotell()) {
    const eff = hotellEffekt(g.hotell, innst(spill));
    const fas = (g.hotell.fasiliteter || []).filter((f) => FASILITET_EFFEKT[f]);
    el.innerHTML = T`<div class="infoboks gress">${g.hotell.telt ? T`⛺ Dere telter i naturen ved <b>${esc(l.by)}</b>. Det er gratis – takket være allemannsretten!` : T`🏨 Dere bor på <b>${esc(g.hotell.navn)}</b> ${'★'.repeat(g.hotell.stjerner)} i ${esc(l.by)}. Tre netter er betalt (${formaterKr(g.hotell.pris)}).`}</div>
      ${g.hotell.hendelse ? T`<div class="infoboks ${g.hotell.hendelse.kr > 0 || g.hotell.hendelse.jobb > 0 ? 'hav' : 'korall'}"><b>Overraskelse ved innsjekk:</b> ${esc(g.hotell.hendelse.tekst)}${g.hotell.hendelse.kr ? ` (${g.hotell.hendelse.kr > 0 ? '+' : '−'}${formaterKr(Math.abs(g.hotell.hendelse.kr))})` : ''}</div>` : ''}
      <div class="kort" style="padding:.8rem 1rem"><b>Slik påvirker hotellet dere</b>
        <div style="margin-top:.4rem">💼 <b>${eff.jobber}</b> ${eff.jobber === 1 ? T('jobb') : T('jobber')} per dag${eff.lonn !== 1 ? T` · lønn <b>${eff.lonn > 1 ? '+' : '−'}${Math.round(Math.abs(eff.lonn - 1) * 100)} %</b>` : ''}</div>
        <div class="liten dempet">${esc(STJERNE_EFFEKT[g.hotell.stjerner].tekst)}</div>
        ${fas.map((f) => `<div style="margin-top:.3rem">${FASILITET_EFFEKT[f].ikon} ${esc(f)}: ${FASILITET_EFFEKT[f].tekst}</div>`).join('')}
      </div>
      <p>Neste steg: gjør reiseloggen for ${esc(l.navn)}, jobb litt – eller reis videre!</p>`;
    return;
  }
  const liste = hoteller(g.posisjon); const i = innst(spill);
  // ⛺ Telt: først tre spørsmål om allemannsretten
  if (teltValg && teltValg.sted === g.posisjon && teltQuiz) {
    const h = liste.find((x) => x.telt); const q = teltQuiz(teltValg.fro);
    const alle = q.every((_, n) => teltValg.svar[n]);
    el.innerHTML = T`<h2>⛺ Telt ved ${esc(l.by)}</h2><div class="infoboks hav">Med <b>allemannsretten</b> kan alle telte gratis i naturen – hvis man følger reglene. Svar riktig på alle tre spørsmålene for å sette opp teltet.</div>
      ${q.map((s, n) => `<div class="oppgavekort"><div class="spm">${n + 1}. ${esc(s.tekst)}</div><div class="svarvalg">${s.valg.map((v) => `<button data-tq="${n}" data-v="${esc(v)}" aria-pressed="${teltValg.svar[n] === v}">${esc(v)}</button>`).join('')}</div></div>`).join('')}
      <div class="rad"><button class="knapp lys" id="teltavbryt">← Tilbake til hotellene</button><button class="knapp sol" id="teltlever" ${!alle || venterPa.hotell ? 'disabled' : ''}>${venterPa.hotell ? T('<span class="venter">Sender</span>') : alle ? T('⛺ Sett opp teltet') : T('Svar på alle først')}</button></div>`;
    $$('[data-tq]').forEach((b) => b.onclick = () => { teltValg.svar[Number(b.dataset.tq)] = b.dataset.v; tegnHotell(); });
    $('#teltavbryt').onclick = () => { teltValg = null; tegnHotell(); };
    $('#teltlever').onclick = async () => {
      const res = await send('hotell', { hotellId: h.id, fro: teltValg.fro, svar: q.map((_, n) => teltValg.svar[n]) });
      if (res.ok) { teltValg = null; feir('⛺'); tegnNeste(); } else { teltValg = { sted: g.posisjon, fro: nyId(10), svar: [] }; tegnHotell(); }
    };
    return;
  }
  const hotellLinje = (h) => {
    const e = hotellEffekt({ stjerner: h.stjerner, fasiliteter: h.fasiliteter }, i);
    const deler = [T`💼 ${e.jobber} ${e.jobber === 1 ? T('jobb') : T('jobber')}/dag`];
    if (e.lonn !== 1) deler.push(T`${e.lonn > 1 ? '💪 +' : '😴 −'}${Math.round(Math.abs(e.lonn - 1) * 100)} % lønn`);
    if (e.rabatt) deler.push('🚌 −10 % fly'); if (e.livliner) deler.push('📶 50/50-livline');
    if (HENDELSE_SJANSE[h.stjerner]) deler.push(T('🎲 overraskelser kan skje'));
    return deler.join(' · ');
  };
  el.innerHTML = T`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;flex-wrap:wrap"><h2>${PAKKE.telt ? T('Overnatting') : T('Hoteller')} i ${esc(l.by)}</h2><button class="knapp mini lys" id="velkomst-igjen">🎬 Se velkomsten igjen</button></div>${liste.some((h) => h.telt) ? T('<div class="infoboks hav">⛺ Her kan dere telte <b>gratis</b> med allemannsretten – hvis dere kan reglene!</div>') : ''}<p class="liten dempet">Prisen er per natt for hele gruppa. Dere må bo tre netter. Et bedre hotell gir bedre søvn – og mer energi til å jobbe.</p>
    ${liste.map((h) => {
      const tot = h.prisNatt * 3; const rad = (g.saldo || 0) >= tot; const lok = iLokalValuta(h.prisNatt, l);
      return T`<div class="hotell"><div><h4>${esc(h.navn)}</h4><div><span class="stjerner">${'★'.repeat(h.stjerner)}</span> <span class="vurdering">${h.vurdering.toLocaleString(LOKALE)}</span> <span class="liten dempet">${avstandTekst(h.sentrumKm)} fra sentrum</span></div>
        <div class="liten" style="margin-top:.3rem">${hotellLinje(h)}</div>
        <div class="liten dempet" style="margin-top:.2rem">${h.fasiliteter.map((f) => FASILITET_EFFEKT[f] ? `<b style="color:var(--hav)">${FASILITET_EFFEKT[f].ikon} ${esc(f)}</b>` : esc(f)).join(' · ')}</div></div>
        <div class="pris"><span class="liten dempet">${formaterKr(h.prisNatt)} / natt${lok ? `<br>(${lok})` : ''}</span><b>${formaterKr(tot)}</b>
        <button class="knapp mini ${rad ? 'gress' : ''}" data-book="${h.id}" ${h.telt ? 'data-telt="1"' : ''} ${!rad || venterPa.hotell ? 'disabled' : ''}>${h.telt ? T('⛺ Sett opp telt') : rad ? T('Book 3 netter') : T('Ikke råd')}</button></div></div>`;
    }).join('')}`;
  $$('[data-book]').forEach((b) => b.onclick = async () => {
    if (b.dataset.telt) { teltValg = { sted: g.posisjon, fro: nyId(10), svar: [] }; tegnHotell(); return; }
    const res = await send('hotell', { hotellId: b.dataset.book }); if (res.ok) { feir('🏨'); tegnNeste(); }
  });
  $('#velkomst-igjen')?.addEventListener('click', spillVelkommen);
}

// ---------- REISELOGG ----------
function diktatHtml(st, i, l) {
  if (!i.diktatBelopPerElev) return '';
  if (PARLOR.harDiktat && !PARLOR.harDiktat(g.posisjon)) return '';   // f.eks. Norge rundt: bare i Troms og Finnmark
  const levert = ['levert', 'godkjent', 'duell', 'laast', 'tapt'].includes(st);
  const belop = formaterKr(i.diktatBelopPerElev * (g.personer || 4));
  const tittel = `<h3 style="margin-top:1.4rem">✍️ ${esc(DIKTATNAVN)} <span class="merke sol">${belop}</span></h3>`;
  const lk = landKode(g.posisjon); const ln = landInfo[lk];
  if (g.diktat?.[lk]) return T`${tittel}<div class="infoboks gress">✅ Dere har klart diktaten for ${esc(ln.navn)}! (Diktaten gis én gang per land.)</div>`;
  if (!levert) return T`${tittel}<p class="liten dempet">Når reiseloggen er levert, kan dere ta diktaten: skriv parlørordene på ${esc(sprakFor(g.posisjon).map((k) => SPRAK[k].navn).join(' eller ') || T('landets språk'))}. 5 av 5 riktige gir ${belop} – én gang per land.</p>`;
  if (g.diktatForsok?.[idag()]?.[lk]) return T`${tittel}<div class="infoboks">Dere har prøvd diktaten i dag. Øv på parløren og prøv igjen i morgen!</div>`;
  const ko = spill.diktatKo?.[gid];
  if (!ko) return T`${tittel}<p>Øv på parløren! Når dere kan ordene utenat, ber dere læreren om diktaten. Alle fem må være riktige for å få <b>${belop}</b>.</p>
    <button class="knapp sol" id="bedk" ${venterPa.diktatbe ? 'disabled' : ''}>🙋 Vi er klare for diktat</button>`;
  if (!ko.aapnet) return T`${tittel}<div class="infoboks sol">⏳ Læreren har fått beskjed. <b>Legg bort notatene</b> – diktaten åpnes når læreren kommer.</div>`;
  const slutt = i.diktatMinutter ? ko.aapnet + i.diktatMinutter * 60000 : null;
  if (slutt && Date.now() > slutt + 30000) return T`${tittel}<div class="infoboks korall">⏰ Tiden gikk ut. Be læreren om å åpne diktaten på nytt.</div>`;
  if (dk.land !== g.posisjon) dk = { land: g.posisjon, svar: [] };
  const sprak = sprakFor(g.posisjon).map((k) => SPRAK[k].navn);
  return T`${tittel}${slutt ? T`<div class="infoboks hav" style="display:flex;justify-content:space-between;align-items:center"><span>⏱️ Tid igjen</span><b data-dkslutt="${slutt}" style="font:800 1.4rem var(--font-tittel)"></b></div>` : ''}<p>Skriv ordene på ${esc(sprakFor(g.posisjon).map((k) => SPRAK[k].navn).join(' eller ') || T('landets språk'))} – med våre bokstaver. Alle fem må være riktige for å få <b>${belop}</b>. Dere har ett forsøk per dag.</p>
    <p class="liten dempet">Språk som godtas i ${esc(ln.navn)}: ${sprak.map(esc).join(', ')}. Store/små bokstaver og aksenter spiller ingen rolle.</p>
    ${PARLOR_ORD.map((o, n) => T`<div class="oppgavekort" style="display:grid;grid-template-columns:8.5rem 1fr;gap:.6rem;align-items:center;padding:.7rem 1rem"><b>${esc(o.norsk)}</b><input data-dk="${n}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(dk.svar[n] ?? '')}" placeholder="På landets språk"></div>`).join('')}
    <button class="knapp sol" id="leverdk" ${venterPa.diktat ? 'disabled' : ''}>${venterPa.diktat ? T('<span class="venter">Sender</span>') : T('Lever diktaten')}</button>`;
}

// ---------- KASSA (regnskap) ----------
// Bygges fra spillets logg, der banken skriver beløpet for hver ting som koster eller gir penger.
const KASSA_KAT = {
  jobb: { ikon: '💼', navn: T('Jobb') }, quiz: { ikon: '🧭', navn: T('Quiz') }, diktat: { ikon: '✍️', navn: DIKTATNAVN },
  duell: { ikon: '⚔️', navn: T('Duellpremier') }, heldig: { ikon: '🍀', navn: T('Heldige overraskelser') }, laererPluss: { ikon: '🧑‍🏫', navn: T('Fra læreren') },
  reise: { ikon: '🧳', navn: T('Reiser') }, hotell: { ikon: '🏨', navn: T('Overnatting') }, utstyr: { ikon: '🧰', navn: T('Utstyr') }, uheldig: { ikon: '🌧️', navn: T('Uheldige overraskelser') }, laererMinus: { ikon: '🧑‍🏫', navn: T('Trukket av læreren') },
};
const REISEMATE = { fly: T('✈️ Fly'), tog: T('🚆 Tog'), buss: T('🚌 Buss'), bat: T('⛴️ Båt') };
let kassaAlle = false;
const storForbokstav = (t) => (t ? String(t)[0].toUpperCase() + String(t).slice(1) : '');
function kassaPoster() {
  const ut = [];
  for (const x of Object.values(spill.logg || {})) {
    if (!x || x.gruppe !== gid) continue;
    const tid = x.tid || 0, b = Number(x.belop) || 0;
    if (x.type === 'billett' && b) ut.push({ tid, kat: 'reise', belop: b, tekst: x.tekst, under: x.reisemate || 'fly' });
    else if (x.type === 'hotell') {
      const kr = Number(x.hendelse?.kr) || 0;
      const pris = x.pris != null ? Number(x.pris) : -(b - kr);
      const sted = landEtterId[x.land];
      if (pris) ut.push({ tid, kat: 'hotell', belop: -pris, tekst: T`${x.navn || T('Overnatting')}${sted ? T` i ${sted.by || sted.navn}` : ''} – 3 netter` });
      if (kr) ut.push({ tid: tid + 1, kat: kr > 0 ? 'heldig' : 'uheldig', belop: kr, tekst: x.hendelse.tekst || T('Overraskelse') });
    }
    else if (['jobb', 'quiz', 'diktat', 'duell', 'utstyr'].includes(x.type) && b) ut.push({ tid, kat: x.type, belop: b, tekst: x.tekst });
    else if (x.type === 'lærer' && b) ut.push({ tid, kat: b > 0 ? 'laererPluss' : 'laererMinus', belop: b, tekst: x.tekst });
  }
  return ut.sort((a, c) => c.tid - a.tid);
}
function tegnKassa() {
  const el = $('#innhold');
  const poster = kassaPoster();
  const start = startbelop();
  const sumKat = {}, reiseType = {};
  let inn = 0, ut = 0;
  for (const p of poster) {
    sumKat[p.kat] = (sumKat[p.kat] || 0) + p.belop;
    if (p.belop > 0) inn += p.belop; else ut -= p.belop;
    if (p.kat === 'reise') reiseType[p.under] = (reiseType[p.under] || 0) - p.belop;
  }
  const annet = Math.round((g.saldo || 0) - (start + inn - ut));
  const innKat = Object.entries(sumKat).filter(([, v]) => v > 0).sort((a, c) => c[1] - a[1]);
  const utKat = Object.entries(sumKat).filter(([, v]) => v < 0).map(([k, v]) => [k, -v]).sort((a, c) => c[1] - a[1]);
  const rad = ([k, v], total, maks, utgift) => {
    const kat = KASSA_KAT[k]; const andel = total ? Math.round(v / total * 100) : 0;
    const under = k === 'reise' && Object.keys(reiseType).length ? Object.entries(reiseType).sort((a, c) => c[1] - a[1]).map(([t, kr]) => `${REISEMATE[t] || t} ${formaterKr(kr)}`).join(' · ') : '';
    return `<div class="kassa-rad"><span class="ik">${kat.ikon}</span><b>${kat.navn} <span class="liten dempet">(${andel} %)</span></b><span class="bel" style="color:var(${utgift ? '--korall' : '--gress'})">${utgift ? '−' : '+'}${formaterKr(v)}</span>
      <div class="kassa-stolpe ${utgift ? 'ut' : ''}"><i style="width:${maks ? Math.max(2, v / maks * 100) : 0}%"></i></div>${under ? `<div class="under">${under}</div>` : ''}</div>`;
  };
  let innsikt = '';
  if (poster.length) {
    const netto = inn - ut;
    innsikt = netto >= 0
      ? T`Dere har tjent <b>${formaterKr(netto)} mer</b> enn dere har brukt. Godt jobbet! 💪`
      : T`Dere har brukt <b>${formaterKr(-netto)} mer</b> enn dere har tjent. Kanskje lurt å jobbe litt før neste reise?`;
    if (utKat[0]) innsikt += T`<br>Mest penger har gått til <b>${KASSA_KAT[utKat[0][0]].navn.toLowerCase()}</b> (${Math.round(utKat[0][1] / ut * 100)} % av utgiftene).`;
    if (innKat[0]) innsikt += T`<br>Den største inntekten deres er <b>${KASSA_KAT[innKat[0][0]].navn.toLowerCase()}</b>.`;
  }
  const vis = kassaAlle ? poster : poster.slice(0, 12);
  const dato = (t) => t ? new Date(t).toLocaleString(LOKALE, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  el.innerHTML = T`
    <h2>💰 Reisekassa</h2>
    <div class="kassa-sum">
      <div><small>Startet med</small><b>${formaterKr(start)}</b></div>
      <div class="naa"><small>Igjen nå</small><b>${formaterKr(g.saldo || 0)}</b></div>
      <div class="inn"><small>Tjent</small><b>+${formaterKr(inn)}</b></div>
      <div class="ut"><small>Brukt</small><b>−${formaterKr(ut)}</b></div>
    </div>
    ${innsikt ? `<div class="infoboks sol">${innsikt}</div>` : T('<div class="infoboks hav">Her kommer regnskapet deres: hva dere tjener penger på, og hva dere bruker dem på. Det fylles ut etter hvert som dere reiser, bor på hotell, jobber og tar quiz.</div>')}
    <h3 style="margin-top:1.2rem">Hvor kom pengene fra?</h3>
    ${innKat.length ? innKat.map((x) => rad(x, inn, innKat[0][1], false)).join('') : T('<p class="tom">Ingen inntekter ennå. Prøv en jobb eller en quiz!</p>')}
    <h3 style="margin-top:1.2rem">Hva brukte dere penger på?</h3>
    ${utKat.length ? utKat.map((x) => rad(x, ut, utKat[0][1], true)).join('') : T('<p class="tom">Ingen utgifter ennå.</p>')}
    <h3 style="margin-top:1.2rem">Kontoutskrift</h3>
    ${vis.length ? vis.map((p) => `<div class="utskrift-rad"><span>${KASSA_KAT[p.kat].ikon}</span><div><span class="tid">${dato(p.tid)}</span>${esc(storForbokstav(p.tekst))}</div><span class="${p.belop > 0 ? 'pluss' : 'minus'}">${p.belop > 0 ? '+' : '−'}${formaterKr(Math.abs(p.belop))}</span></div>`).join('') : T('<p class="tom">Ingen pengebevegelser ennå.</p>')}
    ${poster.length > 12 ? `<button class="knapp lys mini" id="kassa-alle" style="margin-top:.8rem">${kassaAlle ? T('Vis færre') : T`Vis alle (${poster.length})`}</button>` : ''}
    ${Math.abs(annet) >= 1 ? T`<p class="liten dempet" style="margin-top:1rem">${annet > 0 ? '+' : '−'}${formaterKr(Math.abs(annet))} av saldoen kommer fra endringer som ikke står i regnskapet (for eksempel fra før regnskapet kom med i spillet).</p>` : ''}`;
  $('#kassa-alle')?.addEventListener('click', () => { kassaAlle = !kassaAlle; tegnKassa(); });
}

// ---------- JOBB ----------
function tegnJobb() {
  const el = $('#innhold'); const i = innst(spill); const l = landEtterId[g.posisjon];
  const eff = hotellEffekt(g.hotell, i);
  const brukt = g.jobber?.[idag()] || 0; const igjen = Math.max(0, eff.jobber - brukt);
  if (!harHotell()) { el.innerHTML = T`<h2>Jobb</h2><div class="infoboks sol">Dere må bo på hotell i ${esc(l.navn)} for å kunne jobbe der.</div>`; return; }
  if (!igjen) { el.innerHTML = T`<h2>Jobb</h2><div class="infoboks">😴 Dere har jobbet nok i dag (${eff.jobber} ${eff.jobber === 1 ? T('jobb') : T('jobber')} på dette hotellet). Kom tilbake i morgen – eller ta en quiz!</div>`; return; }
  if (!jobb || jobb.land !== g.posisjon) jobb = { land: g.posisjon, fro: nyId(10), svar: [] };
  const j = lagJobb(g.posisjon, jobb.fro);
  el.innerHTML = T`<h2>💼 ${esc(j.tittel)}</h2>
    <p>Lønn i ${esc(l.navn)}: <b>${formaterKr(Math.round(j.lonn * eff.lonn / 10) * 10)}</b> for tre riktige svar${eff.lonn !== 1 ? T` (${eff.lonn > 1 ? '+' : '−'}${Math.round(Math.abs(eff.lonn - 1) * 100)} % fra hotellet)` : ''}. Dere har ${igjen} ${igjen === 1 ? T('jobb') : T('jobber')} igjen i dag.</p>
    ${j.oppgaver.map((o, n) => T`<div class="oppgavekort"><div class="spm">${n + 1}. ${esc(o.tekst)}</div><div class="rad"><input class="vokser" data-jsvar="${n}" inputmode="decimal" placeholder="Svar" value="${esc(jobb.svar[n] ?? '')}" style="max-width:220px"><span class="dempet">${esc(o.enhet)}</span></div></div>`).join('')}
    <button class="knapp sol" id="leverjobb" ${venterPa.jobb ? 'disabled' : ''}>${venterPa.jobb ? T('<span class="venter">Sender</span>') : T('Lever arbeidet')}</button>
    <p class="liten dempet">Tips: Bruk kladdeboka. Dere får betalt for hvert riktige svar.</p>`;
  $$('[data-jsvar]').forEach((inp) => inp.oninput = () => { jobb.svar[Number(inp.dataset.jsvar)] = inp.value; });
  $('#leverjobb').onclick = async () => {
    const res = await send('jobb', { fro: jobb.fro, svar: j.oppgaver.map((_, n) => jobb.svar[n] ?? '') });
    if (res.ok) { feir('💰'); jobb = null; tegnJobb(); }
  };
}

// ---------- QUIZ ----------
function tegnQuiz() {
  const el = $('#innhold'); const i = innst(spill);
  const brukt = g.quiz?.[idag()] || 0; const igjen = Math.max(0, i.quizPerDag - brukt);
  if (quiz?.ferdig) {
    const q = lagQuiz(quiz.fro);
    el.innerHTML = T`<h2>🧭 Resultat</h2>${q.map((s, n) => `<div class="oppgavekort"><div class="spm">${n + 1}. ${esc(s.tekst)}</div>${s.stort ? `<div class="stortflagg">${s.stort}</div>` : ''}<div class="svarvalg">${s.valg.map((v) => `<button disabled class="${v === s.svar ? 'riktig' : quizSvar[n] === v ? 'feil' : ''}">${esc(v)}</button>`).join('')}</div></div>`).join('')}
      <button class="knapp" id="nyquiz" ${igjen ? '' : 'disabled'}>${igjen ? T('Ny quiz') : T('Ingen flere quizer i dag')}</button>`;
    $('#nyquiz').onclick = () => { quiz = null; quizSvar = []; tegnQuiz(); };
    return;
  }
  if (!igjen) { el.innerHTML = T`<h2>🧭 Geografiquiz</h2><div class="infoboks">Dere har tatt ${i.quizPerDag} quizer i dag. Kom tilbake i morgen!</div>`; return; }
  if (!quiz) { quiz = { fro: nyId(10) }; quizSvar = []; }
  const q = lagQuiz(quiz.fro);
  const alle = q.every((_, n) => quizSvar[n]);
  el.innerHTML = T`<h2>🧭 Geografiquiz</h2><p>${formaterKr(i.quizBelop)} per riktig svar. Dere har ${igjen} ${igjen === 1 ? T('quiz') : T('quizer')} igjen i dag. Ingen juksing med atlas – eller … jo, atlas er lov! 📚</p>
    ${q.map((s, n) => `<div class="oppgavekort"><div class="spm">${n + 1}. ${esc(s.tekst)}</div>${s.stort ? `<div class="stortflagg">${s.stort}</div>` : ''}<div class="svarvalg">${s.valg.map((v) => `<button data-q="${n}" data-v="${esc(v)}" aria-pressed="${quizSvar[n] === v}">${esc(v)}</button>`).join('')}</div></div>`).join('')}
    <button class="knapp sol" id="leverquiz" ${!alle || venterPa.quiz ? 'disabled' : ''}>${venterPa.quiz ? T('<span class="venter">Sender</span>') : alle ? T('Lever quizen') : T('Svar på alle først')}</button>`;
  $$('[data-q]').forEach((b) => b.onclick = () => { quizSvar[Number(b.dataset.q)] = b.dataset.v; const y = el.parentElement.scrollTop; tegnQuiz(); el.parentElement.scrollTop = y; });
  $('#leverquiz').onclick = async () => {
    const res = await send('quiz', { fro: quiz.fro, svar: q.map((_, n) => quizSvar[n]) });
    if (res.ok) { quiz.ferdig = true; feir('🧭'); tegnQuiz(); }
  };
}

// ---------- TAVLE ----------
function tegnTavle() {
  const rader = poengtavle(spill);
  $('#innhold').innerHTML = T`<h2>🏆 Poengtavle</h2><div class="kort" style="padding:.4rem .8rem"><table><thead><tr><th>#</th><th>Gruppe</th><th>${stor(ORD.steder)}</th><th>Poeng</th><th style="text-align:right">Penger</th></tr></thead><tbody>${
    rader.map((x, n) => `<tr style="${x.gid === gid ? 'background:var(--sol-lys)' : ''}"><td><b>${n + 1}</b></td><td><span class="rad" style="gap:.4rem"><span class="prikk" style="background:${esc(x.farge)}"></span><b>${esc(x.navn)}</b></span><span class="liten dempet">${landEtterId[x.posisjon]?.flagg || ''} ${esc(landEtterId[x.posisjon]?.navn || '')}</span></td><td class="tall">${x.byer.length} <span class="liten dempet">${PAKKE.modell === 'land' ? T`(${x.kontinenter.length} kont.)` : `(${x.land.length} ${x.land.length === 1 ? ORD.region : ORD.regioner})`}</span></td><td class="tall"><b>${x.poeng}</b></td><td class="tall" style="text-align:right;white-space:nowrap">${formaterKr(x.saldo)}</td></tr>`).join('')
  }</tbody></table></div>`;
}
</script>
<script type="module" src="js/ikoner.js"></script>
</body>
